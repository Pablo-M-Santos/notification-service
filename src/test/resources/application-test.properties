spring.config.name=notification-service,test

# Test profile: use H2 in-memory database
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DEFAULT_NULL_ORDERING=TRUE
spring.datasource.username=sa
spring.datasource.password=

# Disable Flyway in tests (use Hibernate schema validation)
spring.flyway.enabled=false

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# RabbitMQ (disabled in tests)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672

# Telegram (mocked in tests)
telegram.bot-token=test
telegram.chat-id=test